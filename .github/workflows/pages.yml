name: Deploy browser demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".artifacts/**/ecmascript.bin"
      - "examples/web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Git LFS artifacts
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          install -d _site/.artifacts
          install -m 0644 examples/web/index.html examples/web/app.js examples/web/worker.js _site/
          touch _site/.nojekyll

          for encoding in r50k p50k cl100k o200k; do
            source=".artifacts/${encoding}/ecmascript.bin"
            test -s "${source}"
            install -d "_site/.artifacts/${encoding}"
            install -m 0644 "${source}" "_site/.artifacts/${encoding}/ecmascript.bin"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
