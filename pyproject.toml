[project]
name = "bpe2regex"
version = "0.1.0"
description = "Experimental exact BPE encodings compiled into compressed Python and ECMAScript regex programs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "tiktoken==0.14.0",
]

[project.scripts]
bpe2regex = "bpe2regex.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bpe2regex",
    "pyright>=1.1.411",
    "ruff>=0.16.3",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
bpe2regex = { workspace = true, editable = true }

[tool.ruff]
extend-exclude = [".artifacts"]
